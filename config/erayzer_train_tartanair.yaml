data_repeat: 100
debug: false
inference: false
profile: false

dataset:
  name: tartanair
  # Path to a TartanAir root directory, a single image_*.zip archive, or a manifest .txt file.
  train_path: /mnt/projects/p3dcv/anycam/data/tartanair
  eval_path: /mnt/projects/p3dcv/anycam/data/tartanair/ArchVizTinyHouseNight/Data_hard/image_lcam_fish.zip
  camera_name: lcam_fish

model:
  class_name: erayzer_core.model.erayzer.ERayZer
  image_tokenizer:
    image_size: 256
    patch_size: 16
    in_channels: 3
    use_off_the_shelf: false
  input_with_pe: true
  target_image:
    height: 256
    width: 256
  transformer:
    d: 768
    d_head: 64
    encoder_n_layer: 16
    encoder_geom_n_layer: 16
    decoder_n_layer: 8
    neck_n_layer: 1
    fix_decoder: false
    special_init: true
    depth_init: true
    use_qk_norm: true
  pose_latent:
    length: 1
    canonical: middle
    mode: pairwise
  use_deferred_rendering: false
  use_gsplat: true
  near_plane: 0.2
  scaling_bias: -3.0
  scaling_max: -2.0
  gaussians:
    n_gaussians: 1
    range_setting:
      far: 8
      near: 0
      type: linear_depth
    sh_degree: 3
    upsampler:
      upsample_factor: 1
  gs_per_pixel_sqrt: 1
  hard_pixelalign: true
  # mask_input_corners hides the Gaussians of the black fisheye corners, which no loss ever sees. It
  # defaults to on for a "fish" camera_name with a non pinhole camera_model, set it here or with
  # -s model.mask_input_corners False to override that.
  # geer_tile_mode picks how the geer renderer assigns its tiles, "pbf" (the default, nothing beyond 90
  # degrees off axis) or "projection" (a fisheye image out to its border, and a loss mask to match). It
  # only matters with -s model.renderer geer, set it with -s model.geer_tile_mode projection.

training:
  dataset: tartanair
  checkpoint_dir: /mnt/projects/p3dcv/anycam/checkpoints/runs/erayzer-tartanair
  resume_ckpt: /mnt/projects/p3dcv/anycam/checkpoints/pretrained/erayzer_multi.pt
  reset_training_state: true

  batch_size_per_gpu: 2
  num_workers: 4
  max_fwdbwd_passes: 20000
  checkpoint_every: 1000
  save_last: true
  grad_checkpoint_every: 1
  print_every: 20

  num_views: 10
  num_all_views: 10
  num_input_views: 5
  num_target_views: 5
  center_crop: true
  random_shuffle: false
  random_split: true
  max_resample_tries: 100

  view_selector:
    type: two_frame
    min_frame_dist: 15
    max_frame_dist: 45
    use_curriculum: true
    curriculum_iter: 10000
    curriculum_start_min_frame_dist: 12
    curriculum_start_max_frame_dist: 20

  lr: 0.0001
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  warmup: 500
  scheduler_type: cosine
  # Learning rate of the camera heads (focal length and UCM alpha) as a factor of lr, and a cosine
  # decay of that factor to zero over this many forward/backward passes (unit of max_fwdbwd_passes,
  # 0 turns the decay off). The defaults 1.0 and 0 reproduce the schedule the other parameters get.
  camera_lr_scale: 1.0
  camera_lr_decay_steps: 0
  grad_accum_steps: 4
  grad_clip_norm: 1.0
  # Steps with a gradient norm above grad_clip_norm times this factor are skipped (default 2 skipped
  # 60 to 80 percent of all fine-tuning steps). Every other step is still clipped to grad_clip_norm.
  allowed_gradnorm_factor: 10.0
  freeze_focal_steps: 0
  no_pass_steps: 0
  l2_loss_weight: 1.0
  l1_loss_weight: 0.0
  perceptual_loss_weight: 0.2
  perceptual_loss_weight_path: /mnt/projects/p3dcv/anycam/checkpoints/pretrained/imagenet-vgg-verydeep-19.mat
  use_amp: true
  amp_dtype: bf16
  use_tf32: true
