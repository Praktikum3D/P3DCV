<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3DGEER viewer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside id="sidebar">
  <h1>3DGEER viewer</h1>

  <section>
    <h2>Scene</h2>
    <select id="scene-select"></select>
    <button id="scene-load">Load scene</button>
    <p class="status" id="scene-status">no scene</p>
  </section>

  <section>
    <h2>Camera</h2>
    <div class="radios" id="camera-model">
      <label><input type="radio" name="cam" value="pinhole" checked> pinhole</label>
      <label><input type="radio" name="cam" value="fisheye"> fisheye</label>
      <label><input type="radio" name="cam" value="ucm"> ucm</label>
    </div>
    <label class="slider">FOV <span id="fov-value">90&deg;</span>
      <input type="range" id="fov" min="20" max="170" step="1" value="90">
    </label>
    <label class="slider" id="alpha-row" hidden>alpha <span id="alpha-value">0.50</span>
      <input type="range" id="alpha" min="0.01" max="0.99" step="0.01" value="0.5">
    </label>
    <p class="status" id="focal-status">f = &ndash;</p>
  </section>

  <section>
    <h2>Rendering</h2>
    <label class="row">Resolution
      <select id="res"></select>
    </label>
    <label class="row">Tile mode
      <select id="tile-mode">
        <option value="projection">projection</option>
        <option value="pbf">pbf</option>
      </select>
    </label>
    <p class="hint">pbf renders nothing beyond 90 degrees off axis.</p>
    <div class="radios" id="view-mode">
      <label><input type="radio" name="view" value="rgb" checked> RGB</label>
      <label><input type="radio" name="view" value="alpha"> Alpha</label>
      <label id="depth-row" hidden><input type="radio" name="view" value="depth"> Depth</label>
    </div>
  </section>

  <section>
    <h2>View</h2>
    <label class="row checkbox"><input type="checkbox" id="frusta" checked> Input cameras</label>
    <div id="view-buttons" class="views"></div>
    <div class="buttons">
      <button id="reset-view">Reset view</button>
      <button id="save-image">Save image</button>
    </div>
    <p class="status" id="save-status"></p>
  </section>

  <section>
    <h2>Controls</h2>
    <table class="keys">
      <tr><td>drag</td><td>orbit</td></tr>
      <tr><td>shift + drag</td><td>pan</td></tr>
      <tr><td>wheel</td><td>dolly</td></tr>
      <tr><td>W A S D</td><td>fly</td></tr>
      <tr><td>Q E</td><td>up and down</td></tr>
    </table>
    <p class="status" id="stats">&ndash;</p>
  </section>
</aside>

<main id="stage">
  <canvas id="canvas"></canvas>
</main>

<script src="/app.js"></script>
</body>
</html>
